[plugin]

name="Quacky Input Contexts"
description="This plugin allows developers to create and manage new InputMappingContexts (IMCs) via the \"Input Contexts\" panel in the bottom dock, and to assign an InputMappingContext to actions added to the InputMap.

A MouseMode can also be added to each InputMappingContext.

The plugin automatically creates two classes to ensure type safety:

e.g., InputContexts.GLOBAL
Each InputMappingContext you create receives a const variable in the InputContexts file, with the name written in uppercase.

e.g., InputActions.gameplay_jump
Each custom action receives a const variable in the InputActions file, with the name being the same as the action name – case sensitivity is important here.

The desired functionality is ultimately achieved through the autoload \"InputManager\", which allows you to check whether the respective action (type safety with InputActions!) belongs to the top-level InputMappingContext on the active_contexts stack.

The following functions and their native Input.Function equivalents are available for this purpose:

InputManager.event_is_action_pressed(event, action)

= event.is_action_pressed(action)

InputManager.is_action_pressed(action)

= Input.is_action_pressed(action)

InputManager.is_action_just_pressed(action)

= Input.is_action_just_pressed(action)

InputManager.is_action_just_released(action)

= Input.is_action_just_released(action)

Example:

if InputManager.is_action_just_pressed(InputActions.gameplay_jump): ...

To manage InputMappingContexts on the stack, the following functions are available (type safety with InputContexts!):

InputManager.enable_context(context)

InputManager.disable_context(context) - Disables only if `context` is the topmost element of the stack.

Example:

InputManager.enable_context(InputContexts.GAMEPLAY)

"
author="nurquack"
version="1.0.0"
script="plugin.gd"
